apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-nginx
  annotations:
    nginx.org/ssl-redirect: "true"
spec:
  ingressClassName: nginx
   tls:
    - hosts:
      - roboshop.local
        secretName: roboshop-tls
  rules:
    - host: roboshop.local
      http:
          paths:
            # Only ONE rule - frontend's nginx reverse-proxies /api and
            # /version to the backend internally. Backend Service stays
            # ClusterIP-only, no Ingress rule of its own needed.
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: todo-frontend
                  port:
                    number: 80
